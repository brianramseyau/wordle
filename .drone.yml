
kind: pipeline
type: docker
name: wordle

platform:
  os: linux
  arch: amd64

steps:
  - name: Lint Dockerfile
    image: hadolint/hadolint:latest-alpine
    pull: if-not-exists
    commands:
      - hadolint --version
      - hadolint Dockerfile*

  - name: wordle
    image: thegeeklab/drone-docker-buildx
    privileged: true
    settings:
      repo: modem7/wordle
      purge: true
      compress: true
      use_cache: true
      dockerfile: Dockerfile
      build_args: BUILDKIT_INLINE_CACHE=1
      cache_from: "modem7/wordle:latest"
      platforms: # if it doesn't work run docker run --privileged --rm tonistiigi/binfmt --install all
        - linux/amd64
        - linux/arm64
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      tags:
        - latest
        - legacy

  - name: pushrm-dockerhub
    image: chko/docker-pushrm
    environment:
      DOCKER_USER:
        from_secret: docker_username
      DOCKER_PASS:
        from_secret: docker_password
      PUSHRM_FILE: README.md
      PUSHRM_SHORT: Docker Wordle
      PUSHRM_TARGET: modem7/wordle
    when:
      status:
        - success

  - name: slack
    image: themaz/drone-slack
    settings:
      webhook:
        from_secret: slack_hook
    when:
      status: [ success, failure ]

trigger:
  event:
    - custom
