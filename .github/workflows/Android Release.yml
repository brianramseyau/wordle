name: Android Release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Ensure Android SDK platform/build-tools are installed
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Build debug APK
        working-directory: mobile
        run: npm run build:debug

      - name: Locate built APK
        id: apk
        run: |
          APK=$(find mobile/android/app/build/outputs/apk/debug -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "No APK found under mobile/android/app/build/outputs/apk/debug" >&2
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature matches the committed debug cert
        run: |
          APK="${{ steps.apk.outputs.path }}"
          "$JAVA_HOME/bin/keytool" -printcert -jarfile "$APK"
          FINGERPRINT=$("$JAVA_HOME/bin/keytool" -printcert -jarfile "$APK" | grep -m1 'SHA256:' | awk '{print $2}')
          EXPECTED=$("$JAVA_HOME/bin/keytool" -list -v -keystore mobile/android/app/debug.keystore -storepass android -alias androiddebugkey | grep -m1 'SHA256:' | awk '{print $2}')
          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "APK signature does not match the committed debug.keystore" >&2
            exit 1
          fi

      - name: Stage APK
        run: |
          mkdir -p dist
          cp "${{ steps.apk.outputs.path }}" "dist/${{ steps.apk.outputs.name }}"

      - name: Determine release tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=android-latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Wordle Legacy Android (${{ steps.release_tag.outputs.tag }})
          prerelease: ${{ steps.release_tag.outputs.prerelease }}
          body: |
            Debug build of the legacy Wordle Android app, signed with the debug
            certificate committed at `mobile/android/app/debug.keystore`. Since
            that certificate never changes, installing this over an existing
            install upgrades it in place instead of requiring an uninstall.

            Install with `adb install -r ${{ steps.apk.outputs.name }}`, or
            download and open it directly on-device (you'll need to allow
            installs from this source).
          files: dist/${{ steps.apk.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
