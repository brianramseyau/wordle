server {
	listen   80; ## listen for ipv4; this line is default and implied
	listen   8080; ## listen for ipv4; this line is default and implied
	listen   [::]:80 default ipv6only=on; ## listen for ipv6

	root /usr/share/nginx/html;
	index index.html;

	# Make site accessible from http://localhost/
	server_name _;

	location /healthz {
		return 200;
	}

	location / {
		# Serve the file/directory matching the request; for any
		# other path (deep links, typos, trailing slashes, etc.)
		# fall back to index.html and serve the app with a 200,
		# never a 404.
		try_files $uri $uri/ /index.html;
	}


	location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|tiff|ttf|svg|mp4)$ {
		expires 5d;
		# Same fallback as above: a missing/mistyped asset path still
		# serves the app with a 200 instead of a bare 404.
		try_files $uri /index.html;
	}
}
